services:
  sglang-pd:
    image: lmsysorg/sglang:v0.5.12.post1-cu130
    container_name: sglang-pd
    runtime: nvidia
    ipc: host
    shm_size: "64g"
    cap_add:
      - SYS_NICE
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - UCX_TLS=cuda_copy,cuda_ipc,tcp
      - UCX_MEMTYPE_REG_WHOLE_ALLOC_TYPES=cuda
    volumes:
      - /data/models:/models:ro
    devices:
      - /dev/infiniband:/dev/infiniband
    ulimits:
      memlock: -1
      stack: 67108864
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - sh
      - -c
      - |
        set -e

        # ===== 2 decode (GPU 6, 7) =====
        for i in 0 1; do
          GPU_ID=$$((6 + i))
          PORT=$$((30010 + i))
          BOOT_PORT=$$((9010 + i))
          echo "Starting decode on GPU $$GPU_ID port $$PORT bootstrap $$BOOT_PORT..."
          python3 -m sglang.launch_server \
            --model-path /models/qwen3.5-122b-a10b-fp8 \
            --served-model-name qwen3.5-122b \
            --host 0.0.0.0 --port $$PORT \
            --tp 1 --dp 1 --base-gpu-id $$GPU_ID \
            --attention-backend flashinfer \
            --disaggregation-mode decode \
            --disaggregation-transfer-backend nixl \
            --disaggregation-bootstrap-port $$BOOT_PORT \
            --mem-fraction-static 0.85 \
            --context-length 32768 \
            --disable-flashinfer-autotune \
            --skip-server-warmup \
            --enable-metrics \
            --trust-remote-code \
            > /tmp/decode-$$PORT.log 2>&1 &
        done

        echo "Waiting for decode instances (timeout 30 min)..."
        for i in $$(seq 1 360); do
          if curl -sf http://localhost:30010/health > /dev/null 2>&1 && \
             curl -sf http://localhost:30011/health > /dev/null 2>&1; then
            echo "Both decode instances ready after $${i}*5s"
            break
          fi
          sleep 5
        done
        if ! curl -sf http://localhost:30010/health > /dev/null 2>&1; then
          echo "ERROR: decode 30010 failed"; tail -100 /tmp/decode-30010.log; exit 1
        fi
        if ! curl -sf http://localhost:30011/health > /dev/null 2>&1; then
          echo "ERROR: decode 30011 failed"; tail -100 /tmp/decode-30011.log; exit 1
        fi
        echo "=== Decode ready, starting prefill ==="

        # ===== 5 prefill background (GPU 0-4) =====
        for i in 0 1 2 3 4; do
          PORT=$$((30000 + i))
          BOOT_PORT=$$((9000 + i))
          echo "Starting prefill on GPU $$i port $$PORT bootstrap $$BOOT_PORT..."
          python3 -m sglang.launch_server \
            --model-path /models/qwen3.5-122b-a10b-fp8 \
            --served-model-name qwen3.5-122b \
            --host 0.0.0.0 --port $$PORT \
            --tp 1 --dp 1 --base-gpu-id $$i \
            --attention-backend flashinfer \
            --disaggregation-mode prefill \
            --disaggregation-transfer-backend nixl \
            --disaggregation-bootstrap-port $$BOOT_PORT \
            --mem-fraction-static 0.85 \
            --context-length 32768 \
            --disable-flashinfer-autotune \
            --skip-server-warmup \
            --enable-metrics \
            --trust-remote-code \
            > /tmp/prefill-$$PORT.log 2>&1 &
        done

        # GPU 5 prefill foreground (keeps container alive)
        echo "Starting prefill on GPU 5 port 30005 (foreground)..."
        exec python3 -m sglang.launch_server \
          --model-path /models/qwen3.5-122b-a10b-fp8 \
          --served-model-name qwen3.5-122b \
          --host 0.0.0.0 --port 30005 \
          --tp 1 --dp 1 --base-gpu-id 5 \
          --attention-backend flashinfer \
          --disaggregation-mode prefill \
          --disaggregation-transfer-backend nixl \
          --disaggregation-bootstrap-port 9005 \
          --mem-fraction-static 0.85 \
          --context-length 32768 \
          --disable-flashinfer-autotune \
          --skip-server-warmup \
          --enable-metrics \
          --trust-remote-code

  router:
    image: lmsysorg/sglang:v0.5.12.post1-cu130
    container_name: sglang-router
    network_mode: host
    volumes:
      - /data/models:/models:ro
    depends_on:
      sglang-pd:
        condition: service_started
    entrypoint:
      - python3
      - -m
      - sglang_router.launch_router
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "30080"
      - --pd-disaggregation
      - --prefill-policy
      - round_robin
      - --decode-policy
      - round_robin
      - --prefill
      - http://127.0.0.1:30000
      - "9000"
      - --prefill
      - http://127.0.0.1:30001
      - "9001"
      - --prefill
      - http://127.0.0.1:30002
      - "9002"
      - --prefill
      - http://127.0.0.1:30003
      - "9003"
      - --prefill
      - http://127.0.0.1:30004
      - "9004"
      - --prefill
      - http://127.0.0.1:30005
      - "9005"
      - --decode
      - http://127.0.0.1:30010
      - --decode
      - http://127.0.0.1:30011
